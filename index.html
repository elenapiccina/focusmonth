<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Focus 🎯</title>
    <style>
        :root {
            --powder-pink: #F8BBD0;
            --cream-bg: #FFF8F0; /* Matched to cozy cream background palette */
            --text-dark: #524749;  
            --text-muted: #A39295; 
            --card-white: #FFFFFF;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            background-color: transparent;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        /* Container resized to 480px and padded to match Tasks For Today precisely */
        .widget-container {
            width: 100%;
            max-width: 480px;
            background: var(--cream-bg);
            border-radius: 16px;
            border: 1px solid rgba(248, 187, 208, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Top Header Bar styling matched perfectly */
        .header-bar {
            background-color: var(--powder-pink);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .btn-header-reset {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            opacity: 0.9;
            padding: 0;
        }
        .btn-header-reset:hover { opacity: 1; text-decoration: underline; }

        .content-area {
            padding: 16px;
        }

        /* Group listing container */
        .goals-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Goal row box dimensions scaled up to match task card lines */
        .goal-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--card-white);
            border: 1px solid rgba(248, 187, 208, 0.15);
            border-radius: 10px;
            padding: 10px 12px;
            height: 42px; /* Uniform height match */
            box-sizing: border-box;
        }

        .goal-number {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--powder-pink);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            width: 20px;
            flex-shrink: 0;
        }

        /* Text font increased to clean 0.95rem spacing rules */
        .goal-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-dark);
            outline: none;
            padding: 0;
        }
        .goal-input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header-bar">
        <h1 class="header-title">Monthly Priority Focus 🎯</h1>
        <button class="btn-header-reset" onclick="clearMonthlyGoals()">Reset All</button>
    </div>

    <div class="content-area">
        <div class="goals-container">
            <div class="goal-row">
                <span class="goal-number">01</span>
                <input type="text" id="goal1" class="goal-input" placeholder="tap to type main goal..." oninput="saveGoals()">
            </div>
            <div class="goal-row">
                <span class="goal-number">02</span>
                <input type="text" id="goal2" class="goal-input" placeholder="tap to type second goal..." oninput="saveGoals()">
            </div>
            <div class="goal-row">
                <span class="goal-number">03</span>
                <input type="text" id="goal3" class="goal-input" placeholder="tap to type third goal..." oninput="saveGoals()">
            </div>
        </div>
    </div>
</div>

<script>
    function loadSavedGoals() {
        try {
            const stored = localStorage.getItem('notion_monthly_focus_matched_v2');
            if (stored) {
                const parsed = JSON.parse(stored);
                if (parsed.g1) document.getElementById('goal1').value = parsed.g1;
                if (parsed.g2) document.getElementById('goal2').value = parsed.g2;
                if (parsed.g3) document.getElementById('goal3').value = parsed.g3;
            }
        } catch(e) { console.error(e); }
    }

    function saveGoals() {
        const goalData = {
            g1: document.getElementById('goal1').value,
            g2: document.getElementById('goal2').value,
            g3: document.getElementById('goal3').value
        };
        try {
            localStorage.setItem('notion_monthly_focus_matched_v2', JSON.stringify(goalData));
        } catch(e) { console.error(e); }
    }

    function clearMonthlyGoals() {
        // Direct, unblockable layout wipe routine
        document.getElementById('goal1').value = '';
        document.getElementById('goal2').value = '';
        document.getElementById('goal3').value = '';
        saveGoals();
    }

    loadSavedGoals();
</script>

</body>
</html>
