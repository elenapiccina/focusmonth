<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Focus Widget 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top-banner: #F8D2E3;
            --bg-body: #FFF0F3;
            --bg-card-item: #FFFFFF;
            --bg-pill: #FCE8F0;
            --border-soft: #F2D3E0;
            
            --text-main: #92959C;
            --text-dark: #70737B;
            --text-muted: #B0B3BA;
            
            --shadow-subtle: 0 8px 24px rgba(230, 180, 200, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            background-color: transparent;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .widget-card {
            width: 100%;
            max-width: 580px;
            background: var(--bg-body);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            position: relative;
            z-index: 1;
        }

        /* Top Header Banner */
        .top-banner {
            background-color: var(--bg-top-banner);
            padding: 18px 22px;
            border-bottom: 1px solid rgba(230, 180, 200, 0.4);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: var(--text-dark);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
        }

        /* Blooming Flower SVG Header */
        #bloom {
            width: 32px;
            height: 32px;
            flex: none;
            overflow: visible;
        }

        .pt {
            fill: #f7b3cb;
            stroke: #c4466f;
            stroke-width: 1.2;
            transform-box: view-box;
            transform-origin: 40px 40px;
            transform: scale(0.22);
            opacity: 0.35;
            transition: transform 0.5s cubic-bezier(.3,1.6,.5,1), opacity 0.4s;
        }

        .pt.on {
            transform: scale(1);
            opacity: 1;
        }

        .ctr {
            fill: #eaa63c;
        }

        #bloom.full {
            animation: spin 9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .nav-controls {
            display: flex;
            gap: 6px;
        }

        .btn-nav {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-dark);
            font-family: 'Alice', serif;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-nav:hover {
            background: #ffffff;
        }

        .banner-subrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-dark);
            font-size: 0.92rem;
            padding-top: 4px;
        }

        .banner-left {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .banner-right {
            font-style: italic;
            opacity: 0.85;
            font-size: 0.85rem;
        }

        /* Widget Body Content */
        .content-body {
            background-color: var(--bg-body);
            padding: 20px;
        }

        .priority-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }

        .priority-item {
            background: var(--bg-card-item);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .priority-item:focus-within {
            border-color: var(--bg-top-banner);
        }

        .priority-row-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        .priority-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .number-pill {
            background: var(--bg-pill);
            color: var(--text-dark);
            font-size: 0.82rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 8px;
            min-width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .priority-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Alice', serif;
            font-size: 0.98rem;
            color: var(--text-dark);
            transition: opacity 0.15s ease;
        }

        .priority-input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .priority-item.completed {
            background: #F2E8EB;
            border-color: transparent;
        }

        .priority-item.completed .priority-input {
            text-decoration: line-through;
            opacity: 0.55;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-step-toggle {
            font-size: 0.75rem;
            font-family: 'Alice', serif;
            color: var(--text-dark);
            background: var(--bg-pill);
            border: 1px solid var(--border-soft);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-step-toggle:hover {
            background: #ffffff;
            border-color: var(--bg-top-banner);
        }

        .btn-flower {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            opacity: 0.35;
            transition: transform 0.2s cubic-bezier(.3,1.6,.5,1), opacity 0.2s;
            user-select: none;
            padding: 2px;
        }

        .priority-item.completed .btn-flower {
            opacity: 1;
            transform: scale(1.25) rotate(12deg);
        }

        /* Dynamic Subtask Drawer */
        .step-drawer {
            display: none;
            padding-top: 10px;
            border-top: 1px dashed var(--border-soft);
            margin-top: 4px;
        }

        .step-drawer.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtask-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .step-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dark);
            opacity: 0.85;
        }

        .subtask-progress-bar {
            height: 4px;
            width: 100%;
            background: rgba(242, 211, 224, 0.4);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .subtask-progress-fill {
            height: 100%;
            background: #f7b3cb;
            width: 0%;
            transition: width 0.3s ease;
        }

        .subtask-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(252, 232, 240, 0.4);
            border-radius: 8px;
            padding: 4px 8px;
            transition: background 0.15s ease;
        }

        .subtask-item:hover {
            background: rgba(252, 232, 240, 0.8);
        }

        .subtask-check {
            width: 16px;
            height: 16px;
            accent-color: #c4466f;
            cursor: pointer;
            border-radius: 4px;
        }

        .subtask-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Alice', serif;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .subtask-item.completed .subtask-input {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .btn-del-subtask {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .btn-del-subtask:hover {
            color: #c4466f;
        }

        .add-subtask-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .add-subtask-input {
            flex: 1;
            border: 1px solid var(--border-soft);
            outline: none;
            background: #ffffff;
            border-radius: 8px;
            padding: 5px 10px;
            font-family: 'Alice', serif;
            font-size: 0.82rem;
            color: var(--text-dark);
        }

        .add-subtask-input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .btn-add-subtask {
            background: var(--bg-pill);
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            padding: 5px 10px;
            font-family: 'Alice', serif;
            font-size: 0.8rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-add-subtask:hover {
            background: #ffffff;
            border-color: var(--bg-top-banner);
        }

        /* Footer Section */
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
        }

        .counter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .counter-pill {
            background: var(--bg-pill);
            color: var(--text-dark);
            font-weight: bold;
            font-size: 0.82rem;
            padding: 5px 12px;
            border-radius: 8px;
        }

        .btn-clear {
            background: var(--bg-card-item);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 6px 14px;
            font-family: 'Alice', serif;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .btn-clear:hover {
            border-color: var(--bg-top-banner);
            color: var(--text-dark);
        }
    </style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="widget-card">
    <!-- Header Block -->
    <div class="top-banner">
        <div class="header-row">
            <div class="header-title">
                <svg id="bloom" viewBox="0 0 80 80" aria-hidden="true">
                    <g transform="rotate(0 40 40)"><ellipse class="pt" cx="40" cy="22" rx="9" ry="16"/></g>
                    <g transform="rotate(180 40 40)"><ellipse class="pt" cx="40" cy="22" rx="9" ry="16"/></g>
                    <g transform="rotate(60 40 40)"><ellipse class="pt" cx="40" cy="22" rx="9" ry="16"/></g>
                    <g transform="rotate(240 40 40)"><ellipse class="pt" cx="40" cy="22" rx="9" ry="16"/></g>
                    <g transform="rotate(120 40 40)"><ellipse class="pt" cx="40" cy="22" rx="9" ry="16"/></g>
                    <g transform="rotate(300 40 40)"><ellipse class="pt" cx="40" cy="22" rx="9" ry="16"/></g>
                    <circle class="ctr" cx="40" cy="40" r="7"/>
                </svg>
                <span id="monthTitle">OCTOBER 2026 FOCUS</span>
            </div>
            <div class="nav-controls">
                <button class="btn-nav" onclick="changeMonth(-1)">‹</button>
                <button class="btn-nav" onclick="resetToCurrentMonth()">•</button>
                <button class="btn-nav" onclick="changeMonth(1)">›</button>
            </div>
        </div>
        <div class="banner-subrow">
            <div class="banner-left">
                <span>🎯</span> 3 Main Priorities
            </div>
            <div class="banner-right" id="vibeText">
                Keep it gentle & focused
            </div>
        </div>
    </div>

    <!-- Main Content Body -->
    <div class="content-body">
        <div class="priority-list">
            <!-- Priority 1 -->
            <div class="priority-item" id="item-0">
                <div class="priority-row-main">
                    <div class="priority-left">
                        <span class="number-pill">01</span>
                        <input type="text" class="priority-input" id="input-0" placeholder="Priority 1..." oninput="saveData()">
                    </div>
                    <div class="action-group">
                        <button class="btn-step-toggle" id="toggle-btn-0" onclick="toggleDrawer(0)">⚡ steps</button>
                        <button class="btn-flower" id="btn-0" onclick="toggleComplete(0, event)" title="Toggle completion">🌸</button>
                    </div>
                </div>
                <div class="step-drawer" id="drawer-0">
                    <div class="subtask-header">
                        <div class="step-label">Subtask Breakdown</div>
                    </div>
                    <div class="subtask-progress-bar">
                        <div class="subtask-progress-fill" id="progress-0"></div>
                    </div>
                    <div class="subtask-list" id="subtasks-container-0"></div>
                    <div class="add-subtask-row">
                        <input type="text" class="add-subtask-input" id="add-input-0" placeholder="Add a micro subtask..." onkeydown="handleSubtaskKey(event, 0)">
                        <button class="btn-add-subtask" onclick="addSubtaskFromInput(0)">+ Add</button>
                    </div>
                </div>
            </div>

            <!-- Priority 2 -->
            <div class="priority-item" id="item-1">
                <div class="priority-row-main">
                    <div class="priority-left">
                        <span class="number-pill">02</span>
                        <input type="text" class="priority-input" id="input-1" placeholder="Priority 2..." oninput="saveData()">
                    </div>
                    <div class="action-group">
                        <button class="btn-step-toggle" id="toggle-btn-1" onclick="toggleDrawer(1)">⚡ steps</button>
                        <button class="btn-flower" id="btn-1" onclick="toggleComplete(1, event)" title="Toggle completion">🌸</button>
                    </div>
                </div>
                <div class="step-drawer" id="drawer-1">
                    <div class="subtask-header">
                        <div class="step-label">Subtask Breakdown</div>
                    </div>
                    <div class="subtask-progress-bar">
                        <div class="subtask-progress-fill" id="progress-1"></div>
                    </div>
                    <div class="subtask-list" id="subtasks-container-1"></div>
                    <div class="add-subtask-row">
                        <input type="text" class="add-subtask-input" id="add-input-1" placeholder="Add a micro subtask..." onkeydown="handleSubtaskKey(event, 1)">
                        <button class="btn-add-subtask" onclick="addSubtaskFromInput(1)">+ Add</button>
                    </div>
                </div>
            </div>

            <!-- Priority 3 -->
            <div class="priority-item" id="item-2">
                <div class="priority-row-main">
                    <div class="priority-left">
                        <span class="number-pill">03</span>
                        <input type="text" class="priority-input" id="input-2" placeholder="Priority 3..." oninput="saveData()">
                    </div>
                    <div class="action-group">
                        <button class="btn-step-toggle" id="toggle-btn-2" onclick="toggleDrawer(2)">⚡ steps</button>
                        <button class="btn-flower" id="btn-2" onclick="toggleComplete(2, event)" title="Toggle completion">🌸</button>
                    </div>
                </div>
                <div class="step-drawer" id="drawer-2">
                    <div class="subtask-header">
                        <div class="step-label">Subtask Breakdown</div>
                    </div>
                    <div class="subtask-progress-bar">
                        <div class="subtask-progress-fill" id="progress-2"></div>
                    </div>
                    <div class="subtask-list" id="subtasks-container-2"></div>
                    <div class="add-subtask-row">
                        <input type="text" class="add-subtask-input" id="add-input-2" placeholder="Add a micro subtask..." onkeydown="handleSubtaskKey(event, 2)">
                        <button class="btn-add-subtask" onclick="addSubtaskFromInput(2)">+ Add</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-row">
            <div class="counter-group">
                <span class="counter-pill" id="counterPill">0 / 3</span>
                <span>done this month</span>
            </div>
            <button class="btn-clear" onclick="clearAll()">🧹 clear</button>
        </div>
    </div>
</div>

<script>
    let currentDate = new Date(2026, 9, 1);
    
    // Updated state schema with subtask arrays
    let state = {
        inputs: ["Finish my Notion for SALE", "DATING & SOCIALS", "Launch digital products"],
        subtasks: [
            [
                { text: "Clean up template drafts", completed: true },
                { text: "Write sales page copy", completed: false },
                { text: "Export final PDF guides", completed: false }
            ],
            [
                { text: "Update profile bio & photos", completed: true },
                { text: "Plan 1 weekend outing", completed: false }
            ],
            [
                { text: "Set up Gumroad checkout link", completed: false },
                { text: "Draft announcement newsletter", completed: false }
            ]
        ],
        completed: [false, false, false],
        drawersOpen: [false, false, false]
    };

    /* Web Audio Sound System */
    let AC = null;
    function ac() {
        try {
            AC = AC || new (window.AudioContext || window.webkitAudioContext)();
            if (AC.state === 'suspended') AC.resume();
            return AC;
        } catch (e) {
            return null;
        }
    }

    function tone(f, t, d, v, type) {
        let c = ac();
        if (!c) return;
        let o = c.createOscillator(), g = c.createGain(), n = c.currentTime + (t || 0);
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f, n);
        g.gain.setValueAtTime(0.0001, n);
        g.gain.exponentialRampToValueAtTime(v || .1, n + .015);
        g.gain.exponentialRampToValueAtTime(0.0001, n + d);
        o.connect(g);
        g.connect(c.destination);
        o.start(n);
        o.stop(n + d + .05);
    }

    function chime(f, t, v) {
        v = v || .12;
        tone(f, t, .8, v);
        tone(f * 2, t, .45, v * .35);
        tone(f * 3, t, .25, v * .12);
    }

    /* Canvas Particle Effects */
    const cv = document.getElementById('fx'), cx = cv.getContext('2d');
    let P = [], raf = 0;
    const COL = ['#f4a9c2', '#e87ba4', '#ffd1e1', '#f2b84b', '#bfe3c9', '#ffffff'];

    function size() {
        let d = window.devicePixelRatio || 1;
        cv.width = innerWidth * d;
        cv.height = innerHeight * d;
        cx.setTransform(d, 0, 0, d, 0, 0);
    }
    addEventListener('resize', size);
    size();

    function mk(x, y, vx, vy, g, dec, big) {
        return {
            x: x, y: y, vx: vx, vy: vy, g: g, r: Math.random() * 6.3,
            vr: (Math.random() - .5) * .3, s: (big ? 9 : 6) + Math.random() * 8,
            k: Math.random() < .6 ? 0 : (Math.random() < .55 ? 1 : 2),
            c: COL[(Math.random() * COL.length) | 0], life: 1, dec: dec
        };
    }

    function burst(x, y, n, big) {
        for (let i = 0; i < n; i++) {
            let a = Math.random() * 6.283, s = (big ? 6 : 3.5) + Math.random() * (big ? 7 : 5);
            P.push(mk(x, y, Math.cos(a) * s, Math.sin(a) * s - 3, .18, .009 + Math.random() * .01, big));
        }
        loop();
    }

    function rain(n) {
        for (let i = 0; i < n; i++) {
            P.push(mk(Math.random() * innerWidth, -20 - Math.random() * innerHeight * .5, (Math.random() - .5) * 2, 1.5 + Math.random() * 2.5, .02, .002 + Math.random() * .003, true));
        }
        loop();
    }

    function draw(p) {
        cx.save();
        cx.translate(p.x, p.y);
        cx.rotate(p.r);
        cx.globalAlpha = Math.min(1, p.life * 1.6);
        cx.fillStyle = p.c;
        let s = p.s;
        cx.beginPath();
        if (p.k === 0) {
            cx.ellipse(0, 0, s * .55, s * .3, 0, 0, 6.283);
        } else if (p.k === 1) {
            cx.moveTo(0, s * .3);
            cx.bezierCurveTo(-s * .9, -s * .3, -s * .4, -s * .8, 0, -s * .3);
            cx.bezierCurveTo(s * .4, -s * .8, s * .9, -s * .3, 0, s * .3);
        } else {
            cx.moveTo(0, -s * .7);
            cx.quadraticCurveTo(0, 0, s * .7, 0);
            cx.quadraticCurveTo(0, 0, 0, s * .7);
            cx.quadraticCurveTo(0, 0, -s * .7, 0);
            cx.quadraticCurveTo(0, 0, 0, -s * .7);
        }
        cx.fill();
        cx.restore();
    }

    function loop() {
        if (raf) return;
        raf = requestAnimationFrame(function step() {
            cx.clearRect(0, 0, innerWidth, innerHeight);
            P = P.filter(function (p) {
                p.vx *= .986; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= p.dec;
                if (p.life <= 0 || p.y > innerHeight + 40) return false;
                draw(p); return true;
            });
            if (P.length) {
                raf = requestAnimationFrame(step);
            } else {
                raf = 0;
                cx.clearRect(0, 0, innerWidth, innerHeight);
            }
        });
    }

    /* LocalStorage and State Management */
    function safeLoadData() {
        try {
            const stored = localStorage.getItem('monthly_focus_widget_v4');
            if (stored) {
                const parsed = JSON.parse(stored);
                state = Object.assign(state, parsed);
            }
        } catch (e) {
            console.warn("LocalStorage unavailable, using default state.", e);
        }
    }

    function saveData() {
        for (let i = 0; i < 3; i++) {
            const inputEl = document.getElementById(`input-${i}`);
            if (inputEl) state.inputs[i] = inputEl.value;
        }
        try {
            localStorage.setItem('monthly_focus_widget_v4', JSON.stringify(state));
        } catch (e) {
            console.warn("Unable to save state.", e);
        }
        updateCounter();
    }

    function toggleDrawer(index) {
        ac();
        state.drawersOpen[index] = !state.drawersOpen[index];
        tone(600, 0, .05, .04, 'triangle');
        renderDrawers();
        saveData();
    }

    function renderDrawers() {
        for (let i = 0; i < 3; i++) {
            const drawerEl = document.getElementById(`drawer-${i}`);
            if (drawerEl) {
                if (state.drawersOpen[i]) {
                    drawerEl.classList.add('active');
                } else {
                    drawerEl.classList.remove('active');
                }
            }
        }
    }

    /* Subtask Checklist Actions */
    function handleSubtaskKey(e, priorityIndex) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addSubtaskFromInput(priorityIndex);
        }
    }

    function addSubtaskFromInput(priorityIndex) {
        const inputEl = document.getElementById(`add-input-${priorityIndex}`);
        if (!inputEl) return;
        const text = inputEl.value.trim();
        if (!text) return;

        ac();
        tone(780, 0, .05, .05, 'sine');
        
        if (!state.subtasks[priorityIndex]) {
            state.subtasks[priorityIndex] = [];
        }
        state.subtasks[priorityIndex].push({ text: text, completed: false });
        inputEl.value = '';
        
        saveData();
        renderSubtasks(priorityIndex);
    }

    function updateSubtaskText(priorityIndex, subtaskIndex, text) {
        if (state.subtasks[priorityIndex] && state.subtasks[priorityIndex][subtaskIndex]) {
            state.subtasks[priorityIndex][subtaskIndex].text = text;
            saveData();
        }
    }

    function toggleSubtaskComplete(priorityIndex, subtaskIndex, e) {
        ac();
        const list = state.subtasks[priorityIndex];
        if (!list || !list[subtaskIndex]) return;

        list[subtaskIndex].completed = !list[subtaskIndex].completed;
        
        if (list[subtaskIndex].completed) {
            tone(880, 0, .08, .06, 'sine');
            if (e && e.target) {
                const rect = e.target.getBoundingClientRect();
                burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 8, false);
            }
        } else {
            tone(440, 0, .08, .04, 'triangle');
        }

        saveData();
        renderSubtasks(priorityIndex);
    }

    function deleteSubtask(priorityIndex, subtaskIndex) {
        ac();
        tone(350, 0, .06, .05, 'triangle');
        if (state.subtasks[priorityIndex]) {
            state.subtasks[priorityIndex].splice(subtaskIndex, 1);
            saveData();
            renderSubtasks(priorityIndex);
        }
    }

    function renderSubtasks(priorityIndex) {
        const container = document.getElementById(`subtasks-container-${priorityIndex}`);
        if (!container) return;

        const list = state.subtasks[priorityIndex] || [];
        container.innerHTML = '';

        let doneCount = 0;

        list.forEach((st, idx) => {
            if (st.completed) doneCount++;

            const itemDiv = document.createElement('div');
            itemDiv.className = `subtask-item ${st.completed ? 'completed' : ''}`;

            itemDiv.innerHTML = `
                <input type="checkbox" class="subtask-check" ${st.completed ? 'checked' : ''} 
                    onchange="toggleSubtaskComplete(${priorityIndex}, ${idx}, event)">
                <input type="text" class="subtask-input" value="${st.text.replace(/"/g, '&quot;')}" 
                    oninput="updateSubtaskText(${priorityIndex}, ${idx}, this.value)">
                <button class="btn-del-subtask" onclick="deleteSubtask(${priorityIndex}, ${idx})" title="Delete subtask">✕</button>
            `;
            container.appendChild(itemDiv);
        });

        // Update step toggle button badge
        const toggleBtn = document.getElementById(`toggle-btn-${priorityIndex}`);
        if (toggleBtn) {
            toggleBtn.innerText = list.length > 0 ? `⚡ ${doneCount}/${list.length} steps` : '⚡ steps';
        }

        // Update subtask progress fill
        const progressEl = document.getElementById(`progress-${priorityIndex}`);
        if (progressEl) {
            const pct = list.length > 0 ? (doneCount / list.length) * 100 : 0;
            progressEl.style.width = `${pct}%`;
        }
    }

    function render() {
        const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        const titleEl = document.getElementById('monthTitle');
        titleEl.innerText = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()} FOCUS`;

        for (let i = 0; i < 3; i++) {
            const inputEl = document.getElementById(`input-${i}`);
            const itemEl = document.getElementById(`item-${i}`);
            
            if (inputEl) inputEl.value = state.inputs[i] || "";

            if (state.completed[i]) {
                itemEl.classList.add('completed');
            } else {
                itemEl.classList.remove('completed');
            }

            renderSubtasks(i);
        }
        renderDrawers();
        updateCounter();
    }

    function toggleComplete(index, event) {
        ac();
        state.completed[index] = !state.completed[index];
        saveData();
        render();

        const count = state.completed.filter(Boolean).length;

        if (state.completed[index]) {
            chime([523.25, 659.25, 783.99][Math.max(0, count - 1)]);
            
            if (event) {
                const rect = event.currentTarget.getBoundingClientRect();
                burst(rect.left + rect.width / 2, rect.top + rect.height / 2, count === 3 ? 36 : 22, false);
            }

            if (count === 3) {
                [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, k) => chime(f, .25 + k * .1, .1));
                rain(100);
                burst(innerWidth / 2, innerHeight / 3, 60, true);
            }
        } else {
            tone(330, 0, .25, .07, 'triangle');
            tone(247, .07, .3, .06, 'triangle');
        }
    }

    function updateCounter() {
        const count = state.completed.filter(Boolean).length;
        document.getElementById('counterPill').innerText = `${count} / 3`;

        const pts = document.querySelectorAll('#bloom .pt');
        for (let k = 0; k < pts.length; k++) {
            pts[k].classList.toggle('on', k < count * 2);
            pts[k].style.transitionDelay = ((k % 2) * 70) + 'ms';
        }
        document.getElementById('bloom').classList.toggle('full', count === 3);

        const VIBES = ['Keep it gentle & focused', 'One down. That counts.', 'Two down. Nearly there.', 'Three for three. Rest is earned.'];
        document.getElementById('vibeText').innerText = VIBES[count];
    }

    function clearAll() {
        ac();
        state.completed = [false, false, false];
        saveData();
        render();
        tone(392, 0, .2, .06, 'triangle');
        tone(294, .1, .3, .06, 'triangle');
    }

    function changeMonth(delta) {
        ac();
        currentDate.setMonth(currentDate.getMonth() + delta);
        tone(700, 0, .08, .05, 'triangle');
        render();
    }

    function resetToCurrentMonth() {
        ac();
        currentDate = new Date(2026, 9, 1);
        tone(700, 0, .08, .05, 'triangle');
        render();
    }

    safeLoadData();
    render();
</script>

</body>
</html>
