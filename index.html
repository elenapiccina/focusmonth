<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Focus Widget 🌸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top-banner: #F8D2E3;
            --bg-body: #FFF0F3;
            --bg-card-item: #FFFFFF;
            --bg-pill: #FCE8F0;
            --border-soft: #F2D3E0;
            
            --text-main: #92959C;
            --text-dark: #70737B;
            --text-muted: #B0B3BA;
            
            --shadow-subtle: 0 8px 24px rgba(230, 180, 200, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Alice', Georgia, serif;
            background-color: transparent;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .widget-card {
            width: 100%;
            max-width: 580px;
            background: var(--bg-body);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
        }

        /* Solid Header Block (#F8D2E3) */
        .top-banner {
            background-color: var(--bg-top-banner);
            padding: 18px 22px;
            border-bottom: 1px solid rgba(230, 180, 200, 0.4);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: var(--text-dark);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        .nav-controls {
            display: flex;
            gap: 6px;
        }

        .btn-nav {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.5);
            color: var(--text-dark);
            font-family: 'Alice', serif;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-nav:hover {
            background: #ffffff;
        }

        .banner-subrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-dark);
            font-size: 0.92rem;
            padding-top: 4px;
        }

        .banner-left {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .banner-right {
            font-style: italic;
            opacity: 0.85;
            font-size: 0.85rem;
        }

        /* Widget Main Body (#FFF0F3) */
        .content-body {
            background-color: var(--bg-body);
            padding: 20px;
        }

        .priority-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .priority-item {
            background: var(--bg-card-item);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.15s ease;
        }

        .priority-item:focus-within {
            border-color: var(--bg-top-banner);
        }

        .priority-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .number-pill {
            background: var(--bg-pill);
            color: var(--text-dark);
            font-size: 0.82rem;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 8px;
            min-width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .priority-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Alice', serif;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: opacity 0.15s ease;
        }

        .priority-input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        .priority-item.completed .priority-input {
            text-decoration: line-through;
            opacity: 0.55;
        }

        .btn-flower {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.35;
            transition: transform 0.15s ease, opacity 0.15s ease;
            user-select: none;
        }

        .priority-item.completed .btn-flower {
            opacity: 1;
            transform: scale(1.15);
        }

        /* Footer Row */
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .counter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .counter-pill {
            background: var(--bg-pill);
            color: var(--text-dark);
            font-weight: bold;
            font-size: 0.82rem;
            padding: 5px 12px;
            border-radius: 8px;
        }

        .btn-clear {
            background: var(--bg-card-item);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 6px 14px;
            font-family: 'Alice', serif;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }

        .btn-clear:hover {
            border-color: var(--bg-top-banner);
            color: var(--text-dark);
        }
    </style>
</head>
<body>

<div class="widget-card">
    <!-- Solid Pink Header Block (#F8D2E3) -->
    <div class="top-banner">
        <div class="header-row">
            <div class="header-title">
                <span>🌸</span> <span id="monthTitle">SEPTEMBER 2026 FOCUS</span>
            </div>
            <div class="nav-controls">
                <button class="btn-nav" onclick="changeMonth(-1)">‹</button>
                <button class="btn-nav" onclick="resetToCurrentMonth()">•</button>
                <button class="btn-nav" onclick="changeMonth(1)">›</button>
            </div>
        </div>
        <div class="banner-subrow">
            <div class="banner-left">
                <span>🎯</span> 3 Main Priorities
            </div>
            <div class="banner-right">
                Keep it gentle & focused
            </div>
        </div>
    </div>

    <!-- Soft Cream Pink Body (#FFF0F3) -->
    <div class="content-body">
        <div class="priority-list">
            <div class="priority-item" id="item-0">
                <div class="priority-left">
                    <span class="number-pill">01</span>
                    <input type="text" class="priority-input" id="input-0" placeholder="Priority 1..." oninput="saveData()">
                </div>
                <button class="btn-flower" onclick="toggleComplete(0)" title="Toggle completion">🌸</button>
            </div>

            <div class="priority-item" id="item-1">
                <div class="priority-left">
                    <span class="number-pill">02</span>
                    <input type="text" class="priority-input" id="input-1" placeholder="Priority 2..." oninput="saveData()">
                </div>
                <button class="btn-flower" onclick="toggleComplete(1)" title="Toggle completion">🌸</button>
            </div>

            <div class="priority-item" id="item-2">
                <div class="priority-left">
                    <span class="number-pill">03</span>
                    <input type="text" class="priority-input" id="input-2" placeholder="Priority 3..." oninput="saveData()">
                </div>
                <button class="btn-flower" onclick="toggleComplete(2)" title="Toggle completion">🌸</button>
            </div>
        </div>

        <div class="footer-row">
            <div class="counter-group">
                <span class="counter-pill" id="counterPill">0 / 3</span>
                <span>done this month</span>
            </div>
            <button class="btn-clear" onclick="clearAll()">🧹 clear</button>
        </div>
    </div>
</div>

<script>
    let currentDate = new Date(2026, 8, 1);
    let state = {
        inputs: ["Finish my Notion for SALE", "DATING", "my digital products"],
        completed: [false, false, false]
    };

    function safeLoadData() {
        try {
            const stored = localStorage.getItem('monthly_focus_widget_v2');
            if (stored) {
                state = JSON.parse(stored);
            }
        } catch (e) {
            console.warn("LocalStorage unavailable, using default state.", e);
        }
    }

    function saveData() {
        for (let i = 0; i < 3; i++) {
            const inputEl = document.getElementById(`input-${i}`);
            if (inputEl) state.inputs[i] = inputEl.value;
        }
        try {
            localStorage.setItem('monthly_focus_widget_v2', JSON.stringify(state));
        } catch (e) {
            console.warn("Unable to save state.", e);
        }
        updateCounter();
    }

    function render() {
        const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        const titleEl = document.getElementById('monthTitle');
        titleEl.innerText = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()} FOCUS`;

        for (let i = 0; i < 3; i++) {
            const inputEl = document.getElementById(`input-${i}`);
            const itemEl = document.getElementById(`item-${i}`);
            
            inputEl.value = state.inputs[i] || "";
            if (state.completed[i]) {
                itemEl.classList.add('completed');
            } else {
                itemEl.classList.remove('completed');
            }
        }
        updateCounter();
    }

    function toggleComplete(index) {
        state.completed[index] = !state.completed[index];
        saveData();
        render();
    }

    function updateCounter() {
        const count = state.completed.filter(Boolean).length;
        document.getElementById('counterPill').innerText = `${count} / 3`;
    }

    function clearAll() {
        state.completed = [false, false, false];
        saveData();
        render();
    }

    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        render();
    }

    function resetToCurrentMonth() {
        currentDate = new Date(2026, 8, 1);
        render();
    }

    safeLoadData();
    render();
</script>

</body>
</html>
